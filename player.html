<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackathon Video Player</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #171a22;
    --line: #2a2f3c;
    --text: #f2f4f8;
    --muted: #9aa3b5;
    --accent: #ffb020;
    --good: #3ccf7a;
    --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  body { overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- menu ---------- */
  #menu { height: 100%; overflow: auto; padding: 32px 16px 48px; }
  #menu .wrap { max-width: 1100px; margin: 0 auto; }
  #menu h1 { margin: 0 0 4px; font-size: 28px; }
  #menu .sub { color: var(--muted); margin-bottom: 24px; }
  .lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 20px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: 14px; }
  .card .tasks { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .start { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #000; font-weight: 700; font-size: 17px; }
  .start:hover { filter: brightness(1.08); }
  ol.items { margin: 12px 0 0; padding: 0; list-style: none; max-height: 46vh; overflow: auto; border-top: 1px solid var(--line); }
  ol.items li { display: flex; gap: 8px; align-items: baseline; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
  ol.items li .n { color: var(--muted); width: 2.2em; text-align: right; flex: none; }
  ol.items li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.items li .flag { font-size: 12px; flex: none; }
  ol.items li .flag.bad { color: var(--bad); }
  ol.items li .flag.warn { color: var(--accent); }
  ol.items li.group { color: var(--accent); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; padding-top: 12px; }
  ol.items li button.jump { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; font-size: 12px; padding: 2px 8px; flex: none; }
  ol.items li button.jump:hover { color: var(--text); border-color: var(--muted); }
  .settings { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; color: var(--muted); font-size: 14px; }
  .settings input { width: 64px; padding: 4px 6px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .keys { margin-top: 16px; color: var(--muted); font-size: 13px; line-height: 1.7; }
  kbd { background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; font-family: inherit; color: var(--text); }
  .error-box { background: #3a1416; border: 1px solid var(--bad); padding: 16px; border-radius: 10px; line-height: 1.6; }

  /* ---------- stage ---------- */
  #stage { position: fixed; inset: 0; background: #000; }
  #stage video, #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  #stage video.preload { visibility: hidden; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 5vh 6vw; background: var(--bg); }
  .eyebrow { color: var(--muted); font-size: clamp(16px, 2.2vw, 30px); letter-spacing: .08em; text-transform: uppercase; }
  .team { font-size: clamp(40px, 8vw, 140px); font-weight: 800; line-height: 1.05; margin: 2vh 0; overflow-wrap: anywhere; }
  .task { color: var(--accent); font-size: clamp(18px, 2.6vw, 40px); font-weight: 600; }
  .count { font-size: clamp(90px, 22vw, 340px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
  .next { margin-top: 4vh; color: var(--muted); font-size: clamp(16px, 2vw, 28px); }
  .next b { color: var(--text); }
  .note { margin-top: 2vh; color: var(--bad); font-size: clamp(16px, 2vw, 28px); }
  .bar { position: absolute; left: 0; bottom: 0; height: 8px; background: var(--accent); width: 0; }
  #tag { position: absolute; left: 16px; top: 16px; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 8px; font-size: 15px; color: #fff; pointer-events: none; }
  #hud { position: absolute; right: 16px; top: 16px; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 8px; font-size: 14px; color: #fff; pointer-events: none; }
  #paused { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.5); font-size: clamp(32px, 5vw, 72px); font-weight: 800; letter-spacing: .1em; pointer-events: none; }
  body.hide-cursor #stage { cursor: none; }
</style>
</head>
<body>

<div id="menu">
  <div class="wrap">
    <h1>Hackathon Video Player</h1>
    <div class="sub" id="generated"></div>
    <div id="lists" class="lists"></div>

    <div class="settings">
      <label>Team name shown for <input type="number" id="setTitle" min="1" max="60"> s</label>
      <label>Scoring pause <input type="number" id="setScore" min="1" max="120"> s</label>
      <label>Cut off videos after <input type="number" id="setMax" min="0" max="600"> s <span>(0 = never)</span></label>
    </div>
    <div class="keys">
      <kbd>Space</kbd> pause / resume &nbsp; <kbd>&rarr;</kbd> skip ahead &nbsp; <kbd>&larr;</kbd> back to previous team &nbsp;
      <kbd>R</kbd> replay this team's video &nbsp; <kbd>F</kbd> fullscreen &nbsp; <kbd>Esc</kbd> stop and return here
    </div>
  </div>
</div>

<div id="stage" class="hidden">
  <video id="vA" playsinline preload="auto"></video>
  <video id="vB" playsinline preload="auto" class="preload"></video>
  <iframe id="yt" class="hidden" allow="autoplay; encrypted-media; fullscreen"></iframe>

  <div id="titleScreen" class="screen hidden">
    <div class="eyebrow" id="titlePos"></div>
    <div class="team" id="titleTeam"></div>
    <div class="task" id="titleTask"></div>
    <div class="bar" id="titleBar"></div>
  </div>

  <div id="scoreScreen" class="screen hidden">
    <div class="eyebrow">Judges &mdash; submit your scores for</div>
    <div class="team" id="scoreTeam" style="font-size:clamp(32px,5vw,90px)"></div>
    <div class="count" id="scoreCount"></div>
    <div class="note hidden" id="scoreNote"></div>
    <div class="next" id="scoreNext"></div>
    <div class="bar" id="scoreBar"></div>
  </div>

  <div id="endScreen" class="screen hidden">
    <div class="eyebrow">That's all the videos in</div>
    <div class="team" id="endName"></div>
    <div class="next">Press <kbd>Esc</kbd> to return to the menu</div>
  </div>

  <div id="tag" class="hidden"></div>
  <div id="hud" class="hidden"></div>
  <div id="paused" class="hidden">PAUSED</div>
</div>

<script src="playlists.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var DATA = window.PLAYLIST_DATA;

  // ---------------- settings ----------------
  var defaults = { titleSec: 5, scoreSec: 12, maxSec: 60 };
  var settings = Object.assign({}, defaults);
  try { Object.assign(settings, JSON.parse(localStorage.getItem("hackathonPlayerSettings") || "{}")); } catch (e) {}
  function bindSetting(id, key) {
    var el = $(id);
    el.value = settings[key];
    el.addEventListener("change", function () {
      var v = Number(el.value);
      if (!isFinite(v) || v < Number(el.min)) v = defaults[key];
      settings[key] = v; el.value = v;
      try { localStorage.setItem("hackathonPlayerSettings", JSON.stringify(settings)); } catch (e) {}
    });
  }
  bindSetting("setTitle", "titleSec");
  bindSetting("setScore", "scoreSec");
  bindSetting("setMax", "maxSec");

  // ---------------- menu ----------------
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

  function renderMenu() {
    if (!DATA || !DATA.playlists) {
      $("lists").innerHTML = '<div class="error-box"><b>No playlists found.</b><br>' +
        'Run <b>prepare.bat</b> first (it downloads the videos and creates <code>playlists.js</code> next to this file), then reload this page.</div>';
      return;
    }
    $("generated").textContent = "Videos prepared " + DATA.generated + ". Pick a playlist to start. Clicking Start begins playback immediately.";
    var html = "";
    DATA.playlists.forEach(function (pl, p) {
      var bad = pl.items.filter(function (it) { return !it.file && !it.youtube; }).length;
      html += '<div class="card"><h2>' + esc(pl.name) + '<small>' + pl.items.length + ' teams' +
        (bad ? ' &middot; <span style="color:var(--bad)">' + bad + ' missing</span>' : '') + '</small></h2>' +
        '<div class="tasks">' + esc(pl.tasks.join(" · ")) + '</div>' +
        '<button class="start" data-p="' + p + '" data-i="0">&#9654; Start ' + esc(pl.name) + '</button><ol class="items">';
      var lastTask = null;
      pl.items.forEach(function (it, i) {
        if (it.task !== lastTask) { html += '<li class="group">' + esc(it.task) + '</li>'; lastTask = it.task; }
        var flag = "";
        if (!it.file && !it.youtube) flag = '<span class="flag bad" title="' + esc(it.error) + '">no video</span>';
        else if (it.youtube) flag = '<span class="flag warn" title="Streams from YouTube, needs internet">YouTube</span>';
        html += '<li><span class="n">' + (i + 1) + '.</span><span class="t" title="' + esc(it.team) + '">' + esc(it.team) + '</span>' + flag +
          '<button class="jump" data-p="' + p + '" data-i="' + i + '">start here</button></li>';
      });
      html += '</ol></div>';
    });
    $("lists").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll("[data-p]"), function (b) {
      b.addEventListener("click", function () { start(Number(b.dataset.p), Number(b.dataset.i)); });
    });
  }

  // ---------------- playback state ----------------
  var list = null, plName = "", idx = 0, phase = "idle", paused = false;
  var timer = null;          // { remaining, total, onDone, bar }
  var lastTick = 0;
  var vids = [$("vA"), $("vB")], cur = 0;   // vids[cur] is the visible player, the other preloads
  var ytTimer = null;

  function curVid() { return vids[cur]; }
  function otherVid() { return vids[1 - cur]; }

  function showOnly(id) {
    ["titleScreen", "scoreScreen", "endScreen"].forEach(function (s) { $(s).classList.toggle("hidden", s !== id); });
  }

  function stopMedia() {
    vids.forEach(function (v) { v.pause(); });
    var yt = $("yt");
    if (yt.getAttribute("src")) { yt.removeAttribute("src"); yt.src = "about:blank"; }
    yt.classList.add("hidden");
  }

  function start(p, i) {
    list = DATA.playlists[p].items; plName = DATA.playlists[p].name;
    $("menu").classList.add("hidden"); $("stage").classList.remove("hidden");
    document.body.classList.add("hide-cursor");
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function () {});
    }
    // unlock audio playback on both players while we still have the click gesture
    vids.forEach(function (v) { v.muted = false; });
    paused = false; $("paused").classList.add("hidden");
    goTo(i);
  }

  function stopAll() {
    stopMedia(); timer = null; phase = "idle";
    clearTimeout(ytTimer);
    $("stage").classList.add("hidden"); $("menu").classList.remove("hidden");
    document.body.classList.remove("hide-cursor");
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
  }

  // Make sure the video for item i is loaded in one of the two players.
  // Returns the player index holding it.
  function ensureLoaded(i) {
    var it = list[i];
    if (!it || !it.file) return -1;
    for (var k = 0; k < 2; k++) {
      if (vids[k].dataset.file === it.file) return k;
    }
    var k2 = 1 - cur;
    vids[k2].dataset.file = it.file;
    vids[k2].src = it.file;
    vids[k2].load();
    return k2;
  }

  function preloadNext() {
    if (list && idx + 1 < list.length) ensureLoaded(idx + 1);
  }

  function goTo(i) {
    stopMedia();
    clearTimeout(ytTimer);
    if (i < 0) i = 0;
    if (i >= list.length) { showEnd(); return; }
    idx = i;
    var it = list[i];
    // put this team's video in the visible player, rewound, ready to go
    var k = ensureLoaded(i);
    if (k >= 0) {
      cur = k;
      vids[cur].classList.remove("preload"); otherVid().classList.add("preload");
      try { vids[cur].currentTime = 0; } catch (e) {}
    }
    preloadNext();
    showTitle(it);
  }

  // ---------------- phases ----------------
  function showTitle(it) {
    phase = "title";
    $("tag").classList.add("hidden"); updateHud();
    $("titlePos").textContent = plName + "  ·  Team " + (idx + 1) + " of " + list.length;
    $("titleTeam").textContent = it.team;
    $("titleTask").textContent = it.task;
    showOnly("titleScreen");
    runTimer(settings.titleSec, $("titleBar"), function () { playVideo(it); }, null);
  }

  function playVideo(it) {
    phase = "video";
    showOnly(null);
    $("tag").textContent = it.team; $("tag").classList.remove("hidden");
    timer = null;
    if (it.file) {
      var v = curVid();
      v.classList.remove("preload");
      var p = v.play();
      if (p && p.catch) p.catch(function () {
        // Autoplay with sound blocked (e.g. started via keyboard) - fall back to muted
        v.muted = true; v.play().catch(function () { videoFailed(it, "Video could not be played"); });
      });
      if (paused) v.pause();
    } else if (it.youtube) {
      var yt = $("yt");
      yt.classList.remove("hidden");
      yt.src = "https://www.youtube.com/embed/" + encodeURIComponent(it.youtube) + "?autoplay=1&rel=0&modestbranding=1&playsinline=1";
      // We can't see when an embedded YouTube video ends, so give it a fixed slot.
      var slot = (settings.maxSec > 0 ? settings.maxSec : 47);
      runTimer(slot, null, function () { afterVideo(it, null); }, null);
    } else {
      videoFailed(it, "No playable video for this team" + (it.error ? " (" + it.error + ")" : ""));
    }
  }

  function videoFailed(it, msg) {
    if (phase !== "video") return;
    afterVideo(it, msg);
  }

  function afterVideo(it, note) {
    stopMedia();
    phase = "score";
    $("tag").classList.add("hidden");
    $("scoreTeam").textContent = it.team;
    $("scoreNote").textContent = note || "";
    $("scoreNote").classList.toggle("hidden", !note);
    var nxt = list[idx + 1];
    $("scoreNext").innerHTML = nxt ? "Up next: <b>" + esc(nxt.team) + "</b>" : "That was the last team in " + esc(plName);
    showOnly("scoreScreen");
    runTimer(settings.scoreSec, $("scoreBar"), function () { goTo(idx + 1); }, $("scoreCount"));
  }

  function showEnd() {
    phase = "end"; timer = null;
    $("tag").classList.add("hidden"); $("hud").classList.add("hidden");
    $("endName").textContent = plName;
    showOnly("endScreen");
  }

  function updateHud() {
    $("hud").textContent = (idx + 1) + " / " + list.length;
    $("hud").classList.remove("hidden");
  }

  // ---------------- video events ----------------
  vids.forEach(function (v) {
    v.addEventListener("ended", function () {
      if (v === curVid() && phase === "video") afterVideo(list[idx], null);
    });
    v.addEventListener("timeupdate", function () {
      if (v === curVid() && phase === "video" && settings.maxSec > 0 && v.currentTime >= settings.maxSec) afterVideo(list[idx], null);
    });
    v.addEventListener("error", function () {
      if (v === curVid() && phase === "video") videoFailed(list[idx], "Video file could not be played");
    });
  });

  // ---------------- pausable countdown ----------------
  function runTimer(sec, bar, onDone, countEl) {
    timer = { remaining: sec * 1000, total: sec * 1000, onDone: onDone, bar: bar, countEl: countEl };
    lastTick = performance.now();
    drawTimer();
  }
  function drawTimer() {
    if (!timer) return;
    var frac = 1 - timer.remaining / timer.total;
    if (timer.bar) timer.bar.style.width = (Math.min(1, frac) * 100) + "%";
    if (timer.countEl) timer.countEl.textContent = Math.max(0, Math.ceil(timer.remaining / 1000));
  }
  function tick(now) {
    var dt = now - lastTick; lastTick = now;
    if (timer && !paused) {
      timer.remaining -= dt;
      drawTimer();
      if (timer.remaining <= 0) { var done = timer.onDone; timer = null; done(); }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(function (t) { lastTick = t; tick(t); });

  // ---------------- keyboard ----------------
  function togglePause() {
    if (phase === "idle" || phase === "end") return;
    paused = !paused;
    $("paused").classList.toggle("hidden", !paused);
    if (phase === "video" && list[idx].file) { if (paused) curVid().pause(); else curVid().play().catch(function () {}); }
  }
  document.addEventListener("keydown", function (e) {
    if ($("stage").classList.contains("hidden")) return;
    var k = e.key;
    if (k === " " || k === "Spacebar" || k === "k") { e.preventDefault(); togglePause(); }
    else if (k === "ArrowRight") {
      e.preventDefault();
      if (phase === "title") { timer = null; playVideo(list[idx]); }
      else if (phase === "video") afterVideo(list[idx], null);
      else if (phase === "score") goTo(idx + 1);
    }
    else if (k === "ArrowLeft") {
      e.preventDefault();
      if (phase === "end") goTo(list.length - 1);
      else if (phase === "title") goTo(idx - 1);
      else goTo(idx);
    }
    else if (k === "r" || k === "R") { if (phase !== "end") { goTo(idx); timer = null; playVideo(list[idx]); } }
    else if (k === "f" || k === "F") {
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      else document.documentElement.requestFullscreen().catch(function () {});
    }
    else if (k === "Escape") { stopAll(); }
  });

  renderMenu();
})();
</script>
</body>
</html>
